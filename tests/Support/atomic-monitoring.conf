
system_account: SYS
no_auth_user: local
accounts {
    SYS {
        users: [{user: monitor, password: synthetic-n4-monitor}]
        exports: [{service: "$SYS.REQ.SERVER.*.VARZ"}, {service: "$SYS.REQ.SERVER.*.ACCOUNTZ"}, {service: "$SYS.REQ.SERVER.*.ROUTEZ"}]
    }
    HUB {
        jetstream: enabled
        mappings {"n4.mapped": "n4.wire", "123": "n4.wire"}
        users: [{user: local}]
        imports: [{service: {account: SYS, subject: "$SYS.REQ.SERVER.*.VARZ"}}, {service: {account: SYS, subject: "$SYS.REQ.SERVER.*.ACCOUNTZ"}}, {service: {account: SYS, subject: "$SYS.REQ.SERVER.*.ROUTEZ"}}]
    }
}
